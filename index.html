/* ===================== POMOCNÉ KRESLENÍ ===================== */
const R = (x, y, w, h, f, extra) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${extra||''}/>`;
const CELL = 2, GROUND = 160;

function compose(back, front, off, offY){
  offY = offY || 0;
  const H = Math.max(back.length, front.length + offY), W = 16;
  const out = [];
  for (let r = 0; r < H; r++){
    const row = Array(W).fill('.');
    const b = back[r] || '';
    for (let c = 0; c < b.length && c < W; c++) if (b[c] !== '.') row[c] = b[c];
    const f = front[r - offY] || '';
    for (let c = 0; c < f.length; c++){ const x = c + off; if (x < W && f[c] !== '.') row[x] = f[c]; }
    out.push(row.join(''));
  }
  return out;
}
const ONDRA_HEAD_FRONT = ['.GGGGGGGGGG.','GGGGGGGGGGGG','GGSSSSSSSSGG','GSSSSSSSSSSG','SSEESSSSEESS','SSWBBWWBBWSS','SSSBBSSBBSSS','SSSSSNNSSSSS','SSSSSSSSSSSS','SSSSPPPPSSSS','SSSSSSSSSSSS','.SSSSSSSSSS.'];

const PAL_ONDRA = {G:'#c9a46a',S:'#f0c09a',A:'#f0c09a',E:'#8a6a3a',W:'#ffffff',B:'#4f7fb0',N:'#d9a57c',P:'#b9685a',T:'#f7f7f5',J:'#3d4f6b',D:'#eeeeee'};
const ONDRA_FRONT_COMP = compose([], ONDRA_HEAD_FRONT.concat(ONDRA_BODY_FRONT), 2);
SCENES.kap2 = { hotspots: [] };
const FEMALE_TONES = {hair:['#3a2016','#8a5a2b','#c9a46a','#b5452f','#1d1d1d'], top:['#9fd3e6','#e6a0b4','#a8d8a0','#f0d060','#c9a0e0'], jeans:['#3c5a80','#2d2d3a','#6b4a2b'], skin:['#f2c7a5','#e0b08a','#c98f6b']};
const MALE_TONES = {hair:['#c9a46a','#5a3323','#2a1a12','#b5452f'], top:['#2a6fa8','#8a2b2b','#3a7a3a','#e0a030','#7a7a8a'], jeans:['#3d4f6b','#2d2d3a','#6b4a2b'], skin:['#f2c7a5','#e0b08a','#c98f6b']};
const pick1 = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function decoyFemale(){
  const sk = pick1(FEMALE_TONES.skin);
  return { rows: SAB_FRONT_COMP, pal: Object.assign({}, PAL_SAB, { H: pick1(FEMALE_TONES.hair), S: sk, A: sk, C: pick1(FEMALE_TONES.top), J: pick1(FEMALE_TONES.jeans) }), ok: false };
}
function decoyMale(){
  const sk = pick1(MALE_TONES.skin), hair = pick1(MALE_TONES.hair);
  return { rows: ONDRA_FRONT_COMP, pal: Object.assign({}, PAL_ONDRA, { G: hair, E: hair, S: sk, A: sk, T: pick1(MALE_TONES.top), J: pick1(MALE_TONES.jeans) }), ok: false };
}
function buildKap2(){
  const p1 = shuffle([{ rows: SAB_FRONT_COMP, pal: PAL_SAB, ok: true }, decoyFrom(DECOY_F[0]), decoyFrom(DECOY_F[1]), decoyFrom(DECOY_F[2])]);
  const p2 = shuffle([{ rows: ONDRA_FRONT_COMP, pal: PAL_ONDRA, ok: true }, decoyFrom(DECOY_M[0]), decoyFrom(DECOY_M[1]), decoyFrom(DECOY_M[2])]);
  state.cards = { p1: p1, p2: p2 };
  const list = [];
  p1.forEach((c, i) => list.push({ id: 'p1_' + i, x: 6 + i * 48, y: 44, w: 44, h: 66, show: s => !s.flags.p1ok, onTap: [{ pick: { player: 1, ok: c.ok } }] }));
  p2.forEach((c, i) => list.push({ id: 'p2_' + i, x: 206 + i * 48, y: 44, w: 44, h: 66, show: s => s.flags.p1ok && !s.flags.p2ok, onTap: [{ pick: { player: 2, ok: c.ok } }] }));
  return list;
}
function cardsMarkup(){
  let s = R(0, 0, 400, 180, '#101030');
  for (let y = 0; y < 180; y += 12) s += R(0, y, 400, 1, '#16164a');
  s += R(0, 0, 400, 28, '#ff5c8a');
  s += "<text x='200' y='18' text-anchor='middle' font-size='10' font-weight='700' fill='#fff8e7'>PŘÍBĚHÁŘ · VÝBĚR HRÁČU</text>";
  const cards = (list, base, flag) => list.map((c, i) => {
    const x = base + i * 48;
    const hi = state.flags[flag] && c.ok;
    return R(x, 44, 44, 66, hi ? '#ffd27a' : '#3b3560') + R(x + 2, 46, 40, 62, '#2b2250') +
      `<g transform='translate(${x + 6},52)'>${spriteMarkup(c.rows, c.pal, false, 2)}</g>`;
  }).join('');
  s += cards(state.cards.p1, 6, 'p1ok') + cards(state.cards.p2, 206, 'p2ok');
  s += "<text x='6' y='38' font-size='10' fill='#fff8e7'>P1</text><text x='206' y='38' font-size='10' fill='#fff8e7'>P2</text>";
  return s;
}
function pick(p, next){
  if (!p.ok) return say([p.player === 1 ? 'Opravdu by sis chtěla strávit život s tímhle?' : 'Opravdu by sis chtěl strávit život s tímhle?'], next);

function mapPlayUnlock(ids){
  ids.forEach((id, k) => {
    const delay = 300 + k * 450;
    const lock = document.getElementById('maplock-' + id);
    if (lock) lock.animate([
      { transform: 'rotate(0deg) scale(1)', opacity: 1, offset: 0 },
      { transform: 'rotate(-14deg) scale(1.06)', opacity: 1, offset: 0.2 },
      { transform: 'rotate(12deg) scale(1.06)', opacity: 1, offset: 0.4 },
      { transform: 'rotate(0deg) scale(1.7)', opacity: 0, offset: 1 }
    ], { duration: 950, delay: delay, fill: 'both', easing: 'ease-out' });
    const seg = document.getElementById('mapseg-' + id);
    if (seg) seg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: Math.max(0, delay - 250), fill: 'both' });
    const sp = document.getElementById('mapspark-' + id);
    if (sp) Array.from(sp.children).forEach((r, i, arr) => {
      const a = i / arr.length * Math.PI * 2, d = 20 + (i % 2) * 8;
      r.animate([
        { transform: 'translate(0px,0px)', opacity: 0, offset: 0 },
        { transform: 'translate(0px,0px)', opacity: 1, offset: 0.2 },
        { transform: 'translate(' + (Math.cos(a) * d).toFixed(1) + 'px,' + (Math.sin(a) * d).toFixed(1) + 'px)', opacity: 0, offset: 1 }
      ], { duration: 900, delay: delay + 450, fill: 'both', easing: 'ease-out' });
    });
  });
}

function ask(q, opts, next){
  state.busy = true;
  $('dlg').hidden = false;
  $('dlgHint').style.display = 'none';
  $('dlgText').textContent = q;
  const box = $('dlgChoices');
  box.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o.text;
    b.addEventListener('click', e => {
      e.stopPropagation();
      box.innerHTML = '';
      if (o.ok){ $('dlg').hidden = true; state.busy = false; next(); }
      else say([o.reply], () => ask(q, opts, next));
    });
    box.appendChild(b);
  });
}

function torchMaskSVG(cx, cy){
  const rx = 84, ry = 62, c = 6;
  let holes = '';
  for (let y = cy - ry; y <= cy + ry; y += c) for (let x = cx - rx; x <= cx + rx; x += c){
    const dx = (x + c / 2 - cx) / rx, dy = (y + c / 2 - cy) / ry;
    if (dx * dx + dy * dy <= 1) holes += `<rect x='${x}' y='${y}' width='${c}' height='${c}' fill='#000'/>`;
  }
  return `<defs><mask id='torch'><rect x='0' y='0' width='400' height='180' fill='#fff'/>${holes}</mask></defs><rect x='0' y='0' width='400' height='180' fill='#000' opacity='0.86' mask='url(#torch)'/>`;
}

function spriteMarkup(rows, pal, mirror, cell){
  const w = Math.max(...rows.map(r => r.length));
  let out = '';
  rows.forEach((row, r) => {
    let s = row.padEnd(w, '.');
    if (mirror) s = s.split('').reverse().join('');
    for (let c = 0; c < s.length; c++){
      const ch = s[c];
      if (ch === '.' || !pal[ch]) continue;
      out += `<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${pal[ch]}"/>`;
    }
  });
  return out;
}

function frame(t){
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t; if (Date.now() < (state.drunkUntil || 0)) { state.sway = Math.sin(Date.now() / 180) * (state.drunkLevel === 2 ? 14 : 6); placeChar(); }
  if (state.target !== null){
    const d = state.target - state.x;
    const step = SPEED * dt;
    if (Math.abs(d) <= step){
      state.x = state.target;
      state.target = null;
      setPose('front');
      placeChar();
      if (state.sceneId === 'interier' || state.sceneId === 'kopriv') renderObjs(); const cb = state.onArrive;
      state.onArrive = null;
      cb && cb();
    } else {
      state.x += Math.sign(d) * step + (Date.now() < (state.drunkUntil || 0) ? (Math.random() - 0.5) * 60 * dt : 0);
      setPose(d > 0 ? 'right' : 'left'); if (state.sceneId === 'interier' || state.sceneId === 'kopriv') renderObjs();
      placeChar();
    }
  }
  requestAnimationFrame(frame);
}

/* ===================== AKCE ===================== */
function test(c){
  if (c.has) return state.inv.includes(c.has);
  if (c.flag) return !!state.flags[c.flag];
  return false;
}
function playReels(done){
  state.busy = true;
  for (let i = 0; i < 3; i++){ const el = document.getElementById('reel' + i); if (el) el.textContent = '❄'; }
  setTimeout(() => {
    for (let i = 0; i < 3; i++){ const el = document.getElementById('reel' + i); if (el) el.textContent = '♥'; }
    setTimeout(() => { state.busy = false; done(); }, 700);
  }, 1500);
}
function playReelsOld(done){
  state.busy = true;
  const syms = ['♥','⌂','$','★','☺'];
  let n = 0;
  const iv = setInterval(() => {
    for (let i = 0; i < 3; i++){
      const el = document.getElementById('reel' + i);
      if (el) el.textContent = syms[(n + i * 2) % syms.length];
    }
    n++;
    if (n > 24){
      clearInterval(iv);
      for (let i = 0; i < 3; i++){
        const el = document.getElementById('reel' + i);
        if (el) el.textContent = '♥';
      }
      state.busy = false;
      done();
    }
  }, 70);
}
function exec(a, next){
  if (a.say) return say(a.say, next);
  if (a.give){ state.inv.push(a.give); refreshInv(); return next(); }
  if (a.take){
    const k = state.inv.indexOf(a.take);
    if (k >= 0) state.inv.splice(k, 1);
    refreshInv(); return next();
  }
  if (a.flag){
    state.flags[a.flag] = a.value === undefined ? true : a.value;
    renderObjs(); refreshQuest(); return next();
  }
  if (a.walk !== undefined) return walk(a.walk, next);
  if (a.scene === 'kap2'){
    state.sceneId = 'kap2';
    SCENES.kap2.hotspots = buildKap2();
    sabG.style.display = 'none';
    state.target = null;
    renderBg(); renderObjs(); refreshQuest();
    return say(['Dvě místa, dva hráči.', 'Vyber hráče 1 a pak hráče 2.'], next);
  }
if (a.scene === 'olomIntro'){ return olomIntro(next); }
if (a.scene === 'olomBath'){ return olomBath(next); }
if (a.scene === 'olomLoft'){
    state.sceneId = 'olomLoft';
    state.pos = { sab: 60, ond: 210 }; state.flags.strobo = false; $('strobe').classList.remove('on');
    SCENES.olomLoft.hotspots = loftHotspots();
    sabG.style.display = ''; ondG.style.display = 'none';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    state.clockMin = 23 * 60 + 40;
    clearInterval(state.clockTimer);
    state.clockTimer = setInterval(() => { if (state.sceneId !== 'olomLoft') return; state.clockMin = Math.min(state.clockMin + 1, 1439); renderObjs(); }, 4000);
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(['Sabriela je v loftu a Ondra je tu s ní. Hodiny na zdi tikají k půlnoci.', 'Najednou se z koupelny ozve zvuk. Měla by ses tam podívat.'], next);
  }
if (a.scene === 'map'){
    state.sceneId = 'map'; state.flags.strobo = false; $('strobe').classList.remove('on');
    const seen = state.mapSeen || (state.mapSeen = {}), fresh = [];
    mapStops().forEach(x => { const k2 = mapStopState(x, state); if (k2 === 'done') seen[x.id] = true; else if (k2 === 'avail' && !seen[x.id]){ seen[x.id] = true; fresh.push(x.id); } });
    state.mapNew = fresh;
    SCENES.map.hotspots = mapHotspots(); sabG.style.display = 'none';
    renderBg(); renderObjs(); refreshQuest();
    if (fresh.length) mapPlayUnlock(fresh);
    state.busy = true;
    setTimeout(() => { state.mapNew = []; if (fresh.length) say(['Jedeme dál. Na mapě přibyla další zastávka.'], next); else { state.busy = false; next(); } }, fresh.length ? 700 + fresh.length * 450 + 900 : 0);
    return;
  }
  if (a.bed){
    const who = state.active, other = who === 'sab' ? 'ond' : 'sab';
    state.flags['inBed_' + who] = true;
    (who === 'sab' ? sabG : ondG).style.display = 'none';
    renderObjs(); refreshInv();
    if (state.flags['inBed_' + other]){ state.flags.bedDone = true; refreshQuest(); heartBig(); return say(['Oba jste v posteli.', 'V srdci něčemu křupne. Tak to má být.'], () => exec({ fade: true }, () => exec({ scene: 'map' }, next))); }
    switchActive();
    return say(['Jsi v posteli. Teď přepni na druhého.'], next);
  }
  if (a.closeup){ showCloseup(a.closeup); return next(); }
  if (a.scene === 'kopriv'){
    state.sceneId = 'kopriv';
    
    state.pos = { sab: 60, ond: 210 }; state.flags.strobo = true; $('strobe').classList.add('on'); state.crowd = makeCrowd2(); SCENES.kopriv.hotspots = koprivHotspots6(); startDrinks();
    sabG.style.display = ''; ondG.style.display = '';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(KOPRIV_INTRO, next);
  }
  if (a.scene === 'bazen'){
    state.sceneId = 'bazen'; state.flags.strobo = false; $('strobe').classList.remove('on');
    state.hearts = 3;
    SCENES.bazen.hotspots = []; state.bazen = { taps: 0, phase: 1, mx: 340, kx: 340, sx: 120 };
    state.pos = { sab: 90, ond: 300 };
    sabG.style.display = ''; ondG.style.display = '';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(BAZEN_INTRO, next);
  }
  if (a.closeupHead){ showCloseupHead(a.closeupHead.rows, a.closeupHead.pal); return next(); }
  if (a.bazenPhase){ const b = state.bazen; b.phase = a.bazenPhase; b.taps = 0; if (a.bazenPhase === 2) b.kx = 340; renderObjs(); refreshQuest(); return next(); }
  if (a.loseHeart){
    state.hearts = Math.max(0, (state.hearts == null ? 3 : state.hearts) - 1);
    drawHud();
    fadeHeartOut();
    if (state.hearts === 0) return say(['Ondrovi došla srdíčka a odešel. Začínáme znovu.'], () => devJump('bazen'));
    return next();
  }
  if (a.bad){ badClick(); return next(); }
  if (a.drinkTest){ if (state.flags.seenA && state.flags.seenB && !state.flags.drinkedOnce) drinkEvent2(); return next(); }
  if (a.drink){ return miniDrink(next); }
  if (a.hud){ showHud(); return next(); }
  if (a.cam){ state.m2speaker = a.cam; renderObjs(); return next(); }
  if (a.look !== undefined){ state.m2look = a.look; renderObjs(); return next(); }
  if (a.fade){ return fadeTo(next); }
  if (a.scene === 'marry2'){
    state.sceneId = 'marry2';
    sabG.style.display = 'none'; ondG.style.display = 'none';
    state.flags.cry = false; state.flags.strobo = false; $('strobe').classList.remove('on');
    renderBg(); renderObjs(); refreshQuest();
    return run(M2_SCENE4, () => exec({ fade: true }, () => exec({ scene: 'map' }, next)));
  }
  if (a.flight){ return tromsoFlight(next); }
  if (a.scene === 'interm'){
    state.sceneId = 'marry2';
    sabG.style.display = 'none'; ondG.style.display = 'none';
    state.flags.cry = false; state.flags.strobo = false; $('strobe').classList.remove('on');
    state.m2speaker = 'sab'; state.m2look = 2;
    renderBg(); renderObjs(); refreshQuest();
    return run(INTERM, () => exec({ fade: true }, () => exec({ scene: 'map' }, next)));
  }
  if (a.dim){
    const old = document.getElementById('dimOverlay'); if (old) old.remove();
    const d = document.createElement('div'); d.id = 'dimOverlay';
    d.style.cssText = 'position:absolute;inset:0;background:rgba(10,8,20,0);z-index:2;pointer-events:none;transition:background 1.2s;';
    $('wrap').appendChild(d);
    requestAnimationFrame(() => { d.style.background = 'rgba(10,8,20,.45)'; });
    return next();
  }
  if (a.undim){ const d = document.getElementById('dimOverlay'); if (d) d.remove(); return next(); }
  if (a.mallIntro){ return introCard(['Sabriela vyrazila na trek po Mallorce.', 'Cesta vede přes hory Serra de Tramuntana a zabere asi tři dny.', 'Signál je slabý a Ondra čeká na každou zprávu.'], next); }
  if (a.trek){ return mallorcaTrek(next); }
  if (a.scene === 'molo'){
    state.sceneId = 'molo'; state.flags.strobo = false; $('strobe').classList.remove('on');
    state.flags.birdGone = false; state.flags.stoneFound = false;
    state.inv = state.inv.filter(i => i !== 'stone');
    SCENES.molo.hotspots = moloHotspots();
    state.pos = { sab: -100, ond: 60 };
    sabG.style.display = 'none'; ondG.style.display = '';
    state.target = null; state.onArrive = null;
    state.active = 'ond'; state.pose = ''; state.x = state.pos.ond; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(['Molo ve fjordu. Je mlha, zima a všude ticho.', 'Ondra má pro Sabrielu najít kamínek na památku z úplného severu Norska.'], next);
  }
  if (a.moloBird){
    state.flags.birdGone = true; renderObjs(); refreshQuest();
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.innerHTML = moloBirdFly();
    objG.appendChild(g);
    g.animate([{ transform: 'translate(0px,0px)', opacity: 1 }, { transform: 'translate(70px,-60px)', opacity: 1, offset: 0.7 }, { transform: 'translate(110px,-85px)', opacity: 0 }], { duration: 1500, fill: 'forwards', easing: 'ease-in' });
    setTimeout(() => { g.remove(); next(); }, 1600);
    return;
  }
  if (a.moloEnd){
    state.flags.stoneFound = true; state.flags.tromsoDone = true;
    return exec({ fade: true }, () => tromsoFlight(() => exec({ fade: true }, () => exec({ scene: 'interm' }, next)), true));
  }
  if (a.tromsoIntro){ return introCard(['Ondra je od Sabriely hrozně daleko.', 'Každou chvíli, kdy není u ní, jeho srdíčko strádá.', 'Musíš posbírat 10 srdíček dřív, než mu srdce pukne smutkem.'], next); }
  if (a.ski){ return tromsoSki(next); }
  if (a.bath){ return olomBath(next); }
  if (a.fuetGame){ return olomFuet(next); }
  if (a.midnight){ return olomMidnight(next); }
  if (a.heart){ heartPop(); return next(); }
  if (a.sabRedraw){ const cur = state.active; state.active = 'sab'; state.pose = ''; setPose('front'); state.active = cur; state.pose = ''; setPose('front'); return next(); }
  if (a.scene === 'interier'){
    state.sceneId = 'interier';
    if (!state.inv.includes('svetlo')) state.inv.push('svetlo');
    SCENES.interier.hotspots = interierHotspots2();
    state.pos = { sab: 120, ond: 220 };
    sabG.style.display = ''; ondG.style.display = '';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(INTERIER_INTRO2, next);
  }
  if (a.scene === 'chata'){
    state.sceneId = 'chata';
    SCENES.chata.hotspots = chataHotspots();
    state.pos = { sab: 230, ond: 92 };
    sabG.style.display = ''; ondG.style.display = '';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(CHAT_INTRO, next);
  }
  if (a.ask) return ask(a.ask.q, a.ask.opts, next);
  if (a.pick) return pick(a.pick, next);
  if (a.reels) return playReels(next);
  if (a.if) return run(test(a.if) ? (a.then || []) : (a.else || []), next);
  next();
}
function run(list, done){
  let i = 0;
  const next = () => {
    if (i >= list.length){ done && done(); return; }
    exec(list[i++], next);
  };
  next();
}

/* ===================== VSTUP ===================== */
function toScene(e){
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
$('wrap').addEventListener('click', e => {
  if (state.busy){ advance(); return; }
  if (state.sceneId === 'bazen'){ bazenTap2(toScene(e).x); return; }
  const p = toScene(e);
  const h = scene().hotspots.find(h =>
    h.show(state) && inBox(p, h)
  );
  if (state.sceneId === 'kopriv' && (!h || (h.id && h.id.indexOf('crowd') === 0))) badClick();
  if (h && h.stand === undefined) run(h.onTap);
  else if (h) walk(typeof h.stand === 'function' ? h.stand(state) : h.stand, () => run(h.onTap));
  else if (state.sceneId !== 'kap2' && state.sceneId !== 'map') walk(p.x);
});

/* ===================== START ===================== */
(function init(){
  const s = scene();
  state.x = s.start;
  renderBg();
  renderObjs();
  setPose('front');
  placeChar();
  refreshInv();
  refreshQuest();
  $('titleText').textContent = 'Sabriela vkročila do Marry a aniž by si to uvědomila, začala ji hra, která navždy změnila její život.';
devStartFromHash();
  $('title').addEventListener('click', e => {
    e.stopPropagation();
    $('title').hidden = true;
    run(s.intro);
  });
  requestAnimationFrame(frame);
})();
</script>
