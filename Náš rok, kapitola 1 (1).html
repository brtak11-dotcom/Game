/* ===================== POMOCNÉ KRESLENÍ ===================== */
const R = (x, y, w, h, f, extra) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${extra||''}/>`;
const CELL = 2, GROUND = 160;

function compose(back, front, off, offY){
  offY = offY || 0;
  const H = Math.max(back.length, front.length + offY), W = 16;
  const out = [];
  for (let r = 0; r < H; r++){
    const row = Array(W).fill('.');
    const b = back[r] || '';
    for (let c = 0; c < b.length && c < W; c++) if (b[c] !== '.') row[c] = b[c];
    const f = front[r - offY] || '';
    for (let c = 0; c < f.length; c++){ const x = c + off; if (x < W && f[c] !== '.') row[x] = f[c]; }
    out.push(row.join(''));
  }
  return out;
}
const ONDRA_HEAD_FRONT = ['.GGGGGGGGGG.','GGGGGGGGGGGG','GGSSSSSSSSGG','GSSSSSSSSSSG','SSEESSSSEESS','SSWBBWWBBWSS','SSSBBSSBBSSS','SSSSSNNSSSSS','SSSSSSSSSSSS','SSSSPPPPSSSS','SSSSSSSSSSSS','.SSSSSSSSSS.'];

const PAL_ONDRA = {G:'#c9a46a',S:'#f0c09a',A:'#f0c09a',E:'#8a6a3a',W:'#ffffff',B:'#4f7fb0',N:'#d9a57c',P:'#b9685a',T:'#f7f7f5',J:'#3d4f6b',D:'#eeeeee'};
const ONDRA_FRONT_COMP = compose([], ONDRA_HEAD_FRONT.concat(ONDRA_BODY_FRONT), 2);
SCENES.kap2 = { hotspots: [] };

const pick1 = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function decoyFemale(){
  const sk = pick1(FEMALE_TONES.skin);
  return { rows: SAB_FRONT_COMP, pal: Object.assign({}, PAL_SAB, { H: pick1(FEMALE_TONES.hair), S: sk, A: sk, C: pick1(FEMALE_TONES.top), J: pick1(FEMALE_TONES.jeans) }), ok: false };
}
function decoyMale(){
  const sk = pick1(MALE_TONES.skin), hair = pick1(MALE_TONES.hair);
  return { rows: ONDRA_FRONT_COMP, pal: Object.assign({}, PAL_ONDRA, { G: hair, E: hair, S: sk, A: sk, T: pick1(MALE_TONES.top), J: pick1(MALE_TONES.jeans) }), ok: false };
}
function buildKap2(){
  const p1 = shuffle([{ rows: SAB_FRONT_COMP, pal: PAL_SAB, ok: true }, decoyFrom(DECOY_F[0]), decoyFrom(DECOY_F[1]), decoyFrom(DECOY_F[2])]);
  const p2 = shuffle([{ rows: ONDRA_FRONT_COMP, pal: PAL_ONDRA, ok: true }, decoyFrom(DECOY_M[0]), decoyFrom(DECOY_M[1]), decoyFrom(DECOY_M[2])]);
  state.cards = { p1: p1, p2: p2 };
  const list = [];
  p1.forEach((c, i) => list.push({ id: 'p1_' + i, x: 6 + i * 48, y: 44, w: 44, h: 66, show: s => !s.flags.p1ok, onTap: [{ pick: { player: 1, ok: c.ok } }] }));
  p2.forEach((c, i) => list.push({ id: 'p2_' + i, x: 206 + i * 48, y: 44, w: 44, h: 66, show: s => s.flags.p1ok && !s.flags.p2ok, onTap: [{ pick: { player: 2, ok: c.ok } }] }));
  return list;
}
function cardsMarkup(){
  let s = R(0, 0, 400, 180, '#101030');
  for (let y = 0; y < 180; y += 12) s += R(0, y, 400, 1, '#16164a');
  s += R(0, 0, 400, 28, '#ff5c8a');
  s += "<text x='200' y='18' text-anchor='middle' font-size='10' font-weight='700' fill='#fff8e7'>PŘÍBĚHÁŘ · VÝBĚR HRÁČU</text>";
  const cards = (list, base, flag) => list.map((c, i) => {
    const x = base + i * 48;
    const hi = state.flags[flag] && c.ok;
    return R(x, 44, 44, 66, hi ? '#ffd27a' : '#3b3560') + R(x + 2, 46, 40, 62, '#2b2250') +
      `<g transform='translate(${x + 6},52)'>${spriteMarkup(c.rows, c.pal, false, 2)}</g>`;
  }).join('');
  s += cards(state.cards.p1, 6, 'p1ok') + cards(state.cards.p2, 206, 'p2ok');
  s += "<text x='6' y='38' font-size='10' fill='#fff8e7'>P1</text><text x='206' y='38' font-size='10' fill='#fff8e7'>P2</text>";
  return s;
}
function pick(p, next){
  if (!p.ok) return say([p.player === 1 ? 'Opravdu by sis chtěla strávit život s tímhle?' : 'Opravdu by sis chtěl strávit život s tímhle?'], next);

  return say(['Tak tohle je on.', 'Dobrá volba. Tahle hra se hraje ve dvou.'], () => { state.flags.kap2Done = true; exec({ scene: 'map' }, next); });
}

  }
  return `<defs><mask id='torch'><rect x='0' y='0' width='400' height='180' fill='#fff'/>${holes}</mask></defs><rect x='0' y='0' width='400' height='180' fill='#000' opacity='0.86' mask='url(#torch)'/>`;

function spriteMarkup(rows, pal, mirror, cell){
  const w = Math.max(...rows.map(r => r.length));
  let out = '';
  rows.forEach((row, r) => {
    let s = row.padEnd(w, '.');
    if (mirror) s = s.split('').reverse().join('');
    for (let c = 0; c < s.length; c++){
      const ch = s[c];
      if (ch === '.' || !pal[ch]) continue;
      out += `<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${pal[ch]}"/>`;
    }
  });
  return out;
}

    SCENES.kap2.hotspots = buildKap2();
    sabG.style.display = 'none';
    state.target = null;
    renderBg(); renderObjs(); refreshQuest();
    return say(['Dvě místa, dva hráči.', 'Vyber hráče 1 a pak hráče 2.'], next);
  }
if (a.scene === 'olomIntro'){ return olomIntro(next); }
if (a.scene === 'olomBath'){ return olomBath(next); }
if (a.scene === 'olomLoft'){
    state.sceneId = 'olomLoft';
    state.pos = { sab: 60, ond: 210 }; state.flags.strobo = false; $('strobe').classList.remove('on');
    SCENES.olomLoft.hotspots = loftHotspots();
    sabG.style.display = ''; ondG.style.display = 'none';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    state.clockMin = 23 * 60 + 40;
    clearInterval(state.clockTimer);
    state.clockTimer = setInterval(() => { if (state.sceneId !== 'olomLoft') return; state.clockMin = Math.min(state.clockMin + 1, 1439); renderObjs(); }, 4000);
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(['Sabriela je v loftu a Ondra je tu s ní. Hodiny na zdi tikají k půlnoci.', 'Najednou se z koupelny ozve zvuk. Měla by ses tam podívat.'], next);
  }
if (a.scene === 'map'){ state.sceneId = 'map'; state.flags.strobo = false; $('strobe').classList.remove('on'); SCENES.map.hotspots = mapHotspots(); sabG.style.display = 'none'; renderBg(); renderObjs(); refreshQuest(); return say(['Jedeme dál. Na mapě přibyla další zastávka.'], next); }
  if (a.bed){
    const who = state.active, other = who === 'sab' ? 'ond' : 'sab';
    state.flags['inBed_' + who] = true;
    (who === 'sab' ? sabG : ondG).style.display = 'none';
    renderObjs(); refreshInv();
    if (state.flags['inBed_' + other]){ state.flags.bedDone = true; refreshQuest(); heartBig(); return say(['Oba jste v posteli.', 'V srdci něčemu křupne. Tak to má být.'], () => exec({ fade: true }, () => exec({ scene: 'map' }, next))); }
    switchActive();
    return say(['Jsi v posteli. Teď přepni na druhého.'], next);
  }
  if (a.closeup){ showCloseup(a.closeup); return next(); }
  if (a.scene === 'kopriv'){
    state.sceneId = 'kopriv';
    
    state.pos = { sab: 60, ond: 210 }; state.flags.strobo = true; $('strobe').classList.add('on'); state.crowd = makeCrowd2(); SCENES.kopriv.hotspots = koprivHotspots6(); startDrinks();
    sabG.style.display = ''; ondG.style.display = '';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(KOPRIV_INTRO, next);
  }
  if (a.scene === 'bazen'){
    state.sceneId = 'bazen'; state.flags.strobo = false; $('strobe').classList.remove('on');
    state.hearts = 3;
    SCENES.bazen.hotspots = []; state.bazen = { taps: 0, phase: 1, mx: 340, kx: 340, sx: 120 };
    state.pos = { sab: 90, ond: 300 };
    sabG.style.display = ''; ondG.style.display = '';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(BAZEN_INTRO, next);
  }
  if (a.closeupHead){ showCloseupHead(a.closeupHead.rows, a.closeupHead.pal); return next(); }
  if (a.bazenPhase){ const b = state.bazen; b.phase = a.bazenPhase; b.taps = 0; if (a.bazenPhase === 2) b.kx = 340; renderObjs(); refreshQuest(); return next(); }
  if (a.loseHeart){
    state.hearts = Math.max(0, (state.hearts == null ? 3 : state.hearts) - 1);
    drawHud();
    fadeHeartOut();
    if (state.hearts === 0) return say(['Ondrovi došla srdíčka a odešel. Začínáme znovu.'], () => devJump('bazen'));
    return next();
  }
  if (a.bad){ badClick(); return next(); }
  if (a.drinkTest){ if (state.flags.seenA && state.flags.seenB && !state.flags.drinkedOnce) drinkEvent2(); return next(); }
  if (a.drink){ return miniDrink(next); }
  if (a.hud){ showHud(); return next(); }
  if (a.cam){ state.m2speaker = a.cam; renderObjs(); return next(); }
  if (a.look !== undefined){ state.m2look = a.look; renderObjs(); return next(); }
  if (a.fade){ return fadeTo(next); }
  if (a.scene === 'marry2'){
    state.sceneId = 'marry2';
    sabG.style.display = 'none'; ondG.style.display = 'none';
    state.flags.cry = false; state.flags.strobo = false; $('strobe').classList.remove('on');
    renderBg(); renderObjs(); refreshQuest();
    return run(M2_SCENE4, () => exec({ fade: true }, () => exec({ scene: 'map' }, next)));
  }
  if (a.flight){ return tromsoFlight(next); }
  if (a.ski){ return tromsoSki(next); }
  if (a.bath){ return olomBath(next); }
  if (a.fuetGame){ return olomFuet(next); }
  if (a.midnight){ return olomMidnight(next); }
  if (a.heart){ heartPop(); return next(); }
  if (a.sabRedraw){ const cur = state.active; state.active = 'sab'; state.pose = ''; setPose('front'); state.active = cur; state.pose = ''; setPose('front'); return next(); }
  if (a.scene === 'interier'){
    state.sceneId = 'interier';
    if (!state.inv.includes('svetlo')) state.inv.push('svetlo');
    SCENES.interier.hotspots = interierHotspots2();
    state.pos = { sab: 120, ond: 220 };
    sabG.style.display = ''; ondG.style.display = '';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(INTERIER_INTRO2, next);
  }
  if (a.scene === 'chata'){
    state.sceneId = 'chata';
    SCENES.chata.hotspots = chataHotspots();
    state.pos = { sab: 230, ond: 92 };
    sabG.style.display = ''; ondG.style.display = '';
    state.target = null;
    state.active = 'ond'; state.pose = ''; setPose('front');
    state.active = 'sab'; state.pose = ''; state.x = state.pos.sab; setPose('front');
    renderBg(); renderObjs(); placeChar(); refreshInv(); refreshQuest();
    return say(CHAT_INTRO, next);
  }
  if (a.ask) return ask(a.ask.q, a.ask.opts, next);
  if (a.pick) return pick(a.pick, next);
  if (a.reels) return playReels(next);
  if (a.if) return run(test(a.if) ? (a.then || []) : (a.else || []), next);
  next();
}
function run(list, done){
  let i = 0;
  const next = () => {
    if (i >= list.length){ done && done(); return; }
    exec(list[i++], next);
  };
  next();
}

/* ===================== VSTUP ===================== */
function toScene(e){
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
$('wrap').addEventListener('click', e => {
  if (state.busy){ advance(); return; }
  if (state.sceneId === 'bazen'){ bazenTap2(toScene(e).x); return; }
  const p = toScene(e);
  const h = scene().hotspots.find(h =>
    h.show(state) && inBox(p, h)
  );
  if (state.sceneId === 'kopriv' && (!h || (h.id && h.id.indexOf('crowd') === 0))) badClick();
  if (h && h.stand === undefined) run(h.onTap);
  else if (h) walk(typeof h.stand === 'function' ? h.stand(state) : h.stand, () => run(h.onTap));
  else if (state.sceneId !== 'kap2' && state.sceneId !== 'map') walk(p.x);
});

/* ===================== START ===================== */
(function init(){
  const s = scene();
  state.x = s.start;
  renderBg();
  renderObjs();
  setPose('front');
  placeChar();
  refreshInv();
  refreshQuest();
  $('titleText').textContent = 'Sabriela vkročila do Marry a aniž by si to uvědomila, začala ji hra, která navždy změnila její život.';
devStartFromHash();
  $('title').addEventListener('click', e => {
    e.stopPropagation();
    $('title').hidden = true;
    run(s.intro);
  });
  requestAnimationFrame(frame);
})();
</script>
